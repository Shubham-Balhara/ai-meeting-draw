[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-meeting-draw-mcp"
version = "1.0.0"
description = "MCP server (stdio) for AI Meeting Draw boards. Stdlib-only, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AI Meeting Draw contributors" }]
keywords = ["mcp", "model-context-protocol", "diagram", "whiteboard", "AI Meeting Draw"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: Editors",
]

[project.urls]
Homepage = "http://127.0.0.1:8000"

[project.scripts]
ai-meeting-draw-mcp = "ai_meeting_draw_mcp:main"

[tool.setuptools]
py-modules = ["ai_meeting_draw_mcp"]
