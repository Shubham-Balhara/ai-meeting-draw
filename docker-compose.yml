# AI Meeting Draw — app (FastAPI + built SPA) + Postgres.
# Optional vars (DATABRICKS_*, AI_MEETING_DRAW_*) can live in a .env file next to this
# compose file — docker compose reads it automatically. Vars listed without a
# value below are passed through only when set, so absent AI config degrades
# gracefully to 503 instead of overriding backend defaults with empty strings.

services:
  app:
    build:
      context: .
      args:
        # On networks with TLS interception, build with the proxy's root CA:
        #   EXTRA_CA_CERT="$(cat corp-root-ca.pem)" docker compose build
        - EXTRA_CA_CERT=${EXTRA_CA_CERT:-}
    ports:
      # Host port is configurable (AI_MEETING_DRAW_PORT in .env) — handy when another
      # dev server already owns 8000.
      - "${AI_MEETING_DRAW_PORT:-8000}:8000"
    environment:
      # Contract with the Postgres persistence layer — do not change.
      - DATABASE_URL=postgresql://ai_meeting_draw:ai_meeting_draw@db:5432/ai_meeting_draw
      # AI Meeting Draw is anonymous-only (Excalidraw-style): no accounts — the board
      # URL is the share capability. Users bring their own AI key in the app;
      # the DATABRICKS_* vars below configure the OPTIONAL shared server pool.
      - DATABRICKS_HOST
      - DATABRICKS_TOKEN
      - DATABRICKS_CONFIG_PROFILE
      - DATABRICKS_CLAUDE_ENDPOINT
      # Optional zero-cost shared AI tier (OpenRouter :free models) — key-less
      # visitors ride this behind per-IP + daily-budget guards.
      - OPENROUTER_POOL_KEY
      - POOL_MODEL
      - POOL_RPM_PER_IP
      - POOL_RPD_PER_IP
      - POOL_DAILY_BUDGET
      - TURNSTILE_SECRET
      - TURNSTILE_SITE_KEY
      - AI_MEETING_DRAW_ALLOWED_ORIGINS
      # Optional object storage (B2/R2, S3-compatible) — rotated log segments.
      - S3_ENDPOINT_URL
      - S3_BUCKET
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
    volumes:
      # File-backed storage (documents, index, audit.log, ...) is the
      # fallback used when Postgres is unreachable.
      - ai_meeting_draw_storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ai_meeting_draw
      - POSTGRES_PASSWORD=ai_meeting_draw
      - POSTGRES_DB=ai_meeting_draw
    # ports:
    #   - "5432:5432"  # uncomment to reach Postgres from the host for debugging
    volumes:
      - ai_meeting_draw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_meeting_draw -d ai_meeting_draw"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  ai_meeting_draw_storage:
  ai_meeting_draw_pgdata:
