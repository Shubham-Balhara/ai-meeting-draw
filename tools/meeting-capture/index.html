<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Meeting Draw capture</title>
<style>:root{font:16px system-ui;color:#182230;background:#f4f7fb}body{max-width:850px;margin:32px auto;padding:0 18px}main{background:white;border:1px solid #dbe2ea;border-radius:14px;padding:24px;box-shadow:0 8px 30px #18324d14}label{display:block;font-weight:600;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbc7d4;border-radius:7px}button,a.action{display:inline-block;margin:16px 8px 8px 0;padding:10px 16px;border:0;border-radius:7px;background:#3157d5;color:white;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#667085!important}#status,#events{padding:12px;border-radius:7px;background:#f2f5f8;margin-top:12px}#events{white-space:pre-wrap;min-height:160px;max-height:360px;overflow:auto;font:14px ui-monospace,monospace}.error{color:#b42318}audio{width:100%;margin-top:14px}</style></head>
<body><main><h1>AI Meeting Draw capture</h1><p>Local verification helper: mixes a shared tab with your microphone and streams WebM/Opus to the unified backend.</p>
<label for="backend">Backend origin</label><input id="backend" value="http://127.0.0.1:8000"><label for="meeting">Meeting ID</label><input id="meeting" value="test-meeting">
<button id="start">Start capture</button><button id="stop" class="secondary" disabled>Stop</button><a id="board" class="action" target="_blank" hidden>Open live board</a><div id="status">Idle</div><div id="events">Events will appear here.</div><audio id="playback" controls></audio><a id="download" class="action secondary" hidden>Download local recording</a></main>
<script>
const $=id=>document.getElementById(id),start=$('start'),stop=$('stop'),status=$('status'),events=$('events'),board=$('board');let ws,display,mic,context,recorder,chunks=[],recordingUrl;
const log=(text,error=false)=>{const line=document.createElement('div');line.textContent=text;if(error)line.className='error';events.append(line);events.scrollTop=events.scrollHeight};
const cleanup=()=>{display?.getTracks().forEach(t=>t.stop());mic?.getTracks().forEach(t=>t.stop());if(context?.state!=='closed')context?.close()};
const time=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function beginRecorder(stream){const type=['audio/webm;codecs=opus','audio/webm'].find(MediaRecorder.isTypeSupported);recorder=new MediaRecorder(stream,type?{mimeType:type}:{});recorder.ondataavailable=e=>{if(!e.data.size)return;chunks.push(e.data);if(ws?.readyState===WebSocket.OPEN)ws.send(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType});if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(blob);$('playback').src=recordingUrl;$('download').href=recordingUrl;$('download').download=`${$('meeting').value}.webm`;$('download').hidden=false;if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'stop'}));cleanup();start.disabled=false;stop.disabled=true};recorder.start(1000)}
start.onclick=async()=>{try{events.textContent='';chunks=[];board.hidden=true;status.textContent='Choose the Meet tab and enable tab audio…';display=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});if(!display.getAudioTracks().length)throw Error('No tab audio received. Select the Meet tab and enable Share tab audio.');mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});context=new AudioContext();const dest=context.createMediaStreamDestination();context.createMediaStreamSource(display).connect(dest);context.createMediaStreamSource(mic).connect(dest);const origin=$('backend').value.replace(/\/$/,'');ws=new WebSocket(`${origin.replace(/^http/,'ws')}/ws/meetings/${encodeURIComponent($('meeting').value)}/audio`);ws.onopen=()=>ws.send(JSON.stringify({type:'start',format:'audio/webm;codecs=opus',sample_rate:context.sampleRate,capture:{tab_audio:true,microphone:true}}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready'){status.textContent=`Streaming (${m.stt_provider}); session ${m.session_id}`;board.href=origin+m.board_url;board.hidden=false;beginRecorder(dest.stream)}else if(m.type==='transcript')log(`[${time(m.start_seconds)}] ${m.text}`);else if(m.type==='transcript_corrected'&&m.changed)log(`[corrected ${m.sequence}] ${m.corrected_text}`);else if(m.type==='architecture_updated'){status.textContent=`Architecture updated to version ${m.graph_version}`;log(`[architecture] version ${m.graph_version}`)}else if(m.type==='completed'){status.textContent='Completed; server artifacts saved.';log(`[completed] ${m.chunks_received} chunks, ${m.bytes_received} bytes`);ws.close()}else if(m.type?.endsWith('_error')||m.type==='error')log(`[${m.type}] ${m.message}`,true)};ws.onerror=()=>log('WebSocket connection failed.',true);ws.onclose=()=>log('[connection closed]');start.disabled=true;stop.disabled=false}catch(e){status.textContent=`Error: ${e.message}`;log(e.message,true);cleanup();start.disabled=false;stop.disabled=true}};
stop.onclick=()=>{if(recorder?.state==='recording'){status.textContent='Finishing…';recorder.stop()}};
</script></body></html>
